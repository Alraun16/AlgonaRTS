[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
; Ступени карт проходимости. Unit — обычная, по телу бойца. Остальные —
; «широкие»: Recast при построении сужает проходимую зону на радиус агента,
; поэтому путь по такой карте сам держит запас от стен и точками, и
; отрезками. Squad берёт самую широкую ступень, которая не шире его строя;
; список читается кодом отсюда, добавленная строка подхватывается сама.
; Каждая ступень — отдельная карта в уровне, то есть время построения и
; память, поэтому их держим единицы.
